<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>symbol Example</title>
    </head>
    <body>
        <h1>HTML Symbols</h1>
        <p>Copyright Symbol: &copy; 2024</p>
        <p>Registered Trademark Symbol: &reg; 2024</p>
        <p>Trademark Symbol: &trade; 2024</p>
        <p>Euro Currency Symbol: &euro; 100</p>
        <p>Cent Symbol: &cent; 50</p>
        <p>Yen Symbol: &yen; 1000</p>
        <p>Section Symbol: &sect; Section 1</p>
        <p>Paragraph Symbol: &para; This is a new paragraph.</p>    
    </body>
</html>
