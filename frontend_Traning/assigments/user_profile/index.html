<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1><i class="fas fa-users-cog"></i> Employee Management</h1>
            <button id="create-btn" class="btn primary-btn"><i class="fas fa-plus"></i> Create Profile</button>
        </header>

        <main class="content-area">
            <section class="users-list-section" id="users-list-section">
                <!-- User cards will be injected here by JS -->
                <div class="loader" id="list-loader"></div>
            </section>
        </main>
    </div>

    <!-- Modal for Create / Edit (Full) -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal-content glass-effect">
            <div class="modal-header">
                <h2 id="modal-title">Create Profile</h2>
                <button class="close-btn" id="close-modal"><i class="fas fa-times"></i></button>
            </div>
            <form id="profile-form">
                <input type="hidden" id="user-id">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="Maan">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="[EMAIL_ADDRESS]">
                </div>
                <div class="form-group">
                    <label for="company">Company</label>
                    <input type="text" id="company" required placeholder="Name">
                </div>
                <button type="submit" class="btn submit-btn" id="submit-btn">Save Profile</button>
            </form>
        </div>
    </div>

    <!-- Modal for Quick Edit (Patch) -->
    <div class="modal-overlay" id="patch-modal">
        <div class="modal-content glass-effect">
            <div class="modal-header">
                <h2>Quick Edit (PATCH)</h2>
                <button class="close-btn" id="close-patch-modal"><i class="fas fa-times"></i></button>
            </div>
            <form id="patch-form">
                <input type="hidden" id="patch-user-id">
                <div class="form-group">
                    <label for="patch-email">Update Email Only</label>
                    <input type="email" id="patch-email" required placeholder="new@example.com">
                </div>
                <button type="submit" class="btn submit-btn patch-btn">Update Field</button>
            </form>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
